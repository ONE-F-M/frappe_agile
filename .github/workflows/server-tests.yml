name: Server Tests

on:
  pull_request:
    branches: [staging, test-production, version-15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-frappe_agile-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:7-alpine
        ports:
          - 12000:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client xvfb libfontconfig wkhtmltopdf
      - name: Install bench
        run: pip install frappe-bench
      - name: Setup bench
        run: |
          # Same versions as the staging bench; one_fm imports names that later Frappe releases removed.
          bench init --skip-redis-config-generation --frappe-branch v15.112.0 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host 127.0.0.1:13000
          bench set-redis-queue-host 127.0.0.1:11000
          bench set-redis-socketio-host 127.0.0.1:12000
          bench get-app erpnext https://github.com/frappe/erpnext --branch v15.118.3
          # frappe_agile uses one_bpmn at runtime and one_fm's Project fields and project types; one_fm needs these apps.
          bench get-app --skip-assets one_bpmn https://github.com/ONE-F-M/one_bpmn --branch staging
          bench get-app --skip-assets telephony https://github.com/frappe/telephony --branch develop
          bench get-app --skip-assets helpdesk https://github.com/frappe/helpdesk --branch v1.28.1
          bench get-app --skip-assets hrms https://github.com/frappe/hrms --branch v15.63.2
          bench get-app --skip-assets lending https://github.com/frappe/lending --branch version-15
          bench get-app --skip-assets payments https://github.com/frappe/payments --branch version-15
          bench get-app --skip-assets one_fm https://github.com/ONE-F-M/one_fm --branch staging
          bench get-app frappe_agile "$GITHUB_WORKSPACE"
          # The apps' pins leave an older pyOpenSSL beside a newer cryptography; use the pair staging runs.
          ./env/bin/python -m pip install --quiet "pyOpenSSL==26.0.0" "cryptography==46.0.7"
          bench new-site --db-root-password root --admin-password admin --mariadb-root-password root test_site
          bench --site test_site install-app erpnext
          # run-tests only calls frappe_agile's before_tests hooks, so finish ERPNext's setup wizard here.
          bench --site test_site execute erpnext.setup.utils.before_tests
          bench --site test_site install-app telephony helpdesk hrms lending payments one_fm
          bench --site test_site install-app frappe_agile
          bench --site test_site set-config allow_tests true
      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app frappe_agile --failfast
